# Reviewed configuration of anvilkit-agent-background-worker (DD-09 §1/§4):
# the secret-free, placement-free bounds of the Worker (`worker` entry) and
# of the owner queue relay (`relay` entry, run beside each owner). Placements
# and secrets arrive only through the allowlisted environment:
# ANVILKIT_BACKGROUND_WORKER_HEALTH_LISTEN, _IDENTITY_MODE,
# _IDENTITY_{CERT,KEY,CA}_FILE, _OWNER_SERVER_NAME, _QUEUE_URL or _QUEUE_URL_FILE (the
# queue Valkey — a separate instance from any cache), _QUEUE_TLS_CA_FILE,
# _NATS_URL, _NATS_TLS_{MODE,CA_FILE,CERT_FILE,KEY_FILE,SERVER_NAME},
# _NATS_CREDS_FILE (the relay's NATS credential),
# _KNOWLEDGE_ADDRESS, _MCP_ADDRESS, _CONTRACTS_DIR, _BULL_BOARD_LISTEN,
# _RELAY_OWNER, _RELAY_DATABASE_URL or _RELAY_DATABASE_URL_FILE (the owner's
# relay role). Any other ANVILKIT_BACKGROUND_WORKER_* variable, any unknown
# key here and any secret or placement key here rejects the candidate.
# DEVELOPMENT_ONLY bounds below are not production capacity (ENV-05).
# development: the top-level DEVELOPMENT_ONLY guard (P0.1, P0.6): it admits
# identity.mode development (a plaintext owner transport), nats.tls.mode
# development (plaintext NATS without a credential), a redis:// queue URL
# without an ACL user and a relay database URL without sslmode=verify-full;
# it downgrades nothing by itself. This file is also the image's default
# configuration (the owner charts' relay containers read it), so the guard
# stays off here; a development run supplies its own file with the guard on
# and nats.tls.mode development.
development:
  enabled: false
# identity: the workload identity the owner clients present (P0.1). mtls
# presents the watched certificate and verifies each owner by its
# server_name (a DNS SAN); the files are placements
# (ANVILKIT_BACKGROUND_WORKER_IDENTITY_{CERT,KEY,CA}_FILE; the relay
# container of an owner Pod sets them with _IDENTITY_MODE and
# _OWNER_SERVER_NAME). development is plaintext (requires development.enabled).
identity:
  mode: mtls
  reload_interval: 5s
owners:
  knowledge:
    server_name: anvilkit-agent-knowledge
  mcp:
    server_name: anvilkit-agent-mcp
health:
  listen: 127.0.0.1:9127
queue:
  # BullMQ key prefix: anvilkit:<owner>:<queue>:... (application namespace
  # anvilkit:<domain>:, the library's internal keys stay its own).
  # Outside development the URL is rediss://<user>:<password>@host:port (TLS
  # and the queue's ACL user, P0.6); tls.ca_file (or
  # ANVILKIT_BACKGROUND_WORKER_QUEUE_TLS_CA_FILE; Node's default roots with
  # NODE_EXTRA_CA_CERTS when empty) and tls.server_name (the URL host when
  # empty) verify the server of a rediss:// URL on every queue connection.
  prefix: anvilkit
# nats: the relay's NATS transport (P0.6). tls requires and verifies TLS
# against tls.ca_file (Node's default roots with NODE_EXTRA_CA_CERTS when
# empty) under tls.server_name (the URL host when empty); mtls also presents
# tls.cert_file and tls.key_file; development is plaintext (requires
# development.enabled). The credential is environment-only
# (ANVILKIT_BACKGROUND_WORKER_NATS_CREDS_FILE: a NATS user .creds file or a
# bare NKey user seed, read at start) and required outside development.
# Validated while NATS is placed (the relay entry).
nats:
  tls:
    mode: tls
worker:
  concurrency: 4
  # The lease asked of the owner and the heartbeat that keeps it; losing the
  # lease stops the handler.
  lease_seconds: 60
  heartbeat_interval: 15s
  max_input_bytes: 65536
  # Above the parser profile's 600 s deadline plus its grace: a slow parse
  # ends on the Job's deadline (Knowledge's verdict), not on this bound.
  handler_timeout: 12m
  # Queue-level delivery bounds (BullMQ attempts/backoff/lock/stall); the
  # owner's attempt bound is the business limit.
  attempts: 3
  backoff: 5s
  lock_duration: 60s
  stalled_interval: 30s
  max_stalled_count: 1
  # A lost submission receipt: the identical result is resubmitted this many
  # times, then the owner is queried.
  submit_retries: 3
  owner_timeout: 10s
  shutdown_timeout: 30s
bull_board:
  # Read-only by default; a retry from the board re-enqueues a job whose
  # claim still passes the owner's admission (budget, revocation, state).
  enabled: false
  listen: 127.0.0.1:9128
  read_only: true
relay:
  # The fixed durable pull consumer of the owner's background.requested
  # subject: explicit ACK after the inbox commit, bounded ack wait and
  # deliveries; the reconcile loop reconstructs queue entries from durable
  # requests older than reconcile_age that have no queue entry.
  batch: 16
  ack_wait: 30s
  max_deliver: 100
  reconcile_interval: 10s
  reconcile_age: 5s
  reconcile_limit: 500
  shutdown_timeout: 30s
