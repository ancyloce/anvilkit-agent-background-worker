{{- include "anvilkit-agent-background-worker.require" . -}}
{{- $cfg := include "anvilkit-agent-background-worker.config" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvilkit-agent-background-worker.fullname" . }}
  labels:
    {{- include "anvilkit-agent-background-worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "anvilkit-agent-background-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anvilkit-agent-background-worker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: background-worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ $cfg | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "anvilkit-agent-background-worker.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "anvilkit-agent-background-worker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- if .Values.trust.configMap }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/anvilkit/trust/ca.crt
            {{- end }}
            - name: ANVILKIT_BACKGROUND_WORKER_CONFIG
              value: /etc/anvilkit/anvilkit-agent-background-worker/config.yaml
            - name: ANVILKIT_BACKGROUND_WORKER_HEALTH_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.health.port) | quote }}
            {{- if .Values.telemetry.otlpEndpoint }}
            - name: ANVILKIT_BACKGROUND_WORKER_TELEMETRY_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            {{- end }}
            {{- if eq .Values.secrets.provider "csi" }}
            - name: ANVILKIT_BACKGROUND_WORKER_QUEUE_URL_FILE
              value: /var/run/secrets/anvilkit/csi/queue-url
            {{- else }}
            - name: ANVILKIT_BACKGROUND_WORKER_QUEUE_URL_FILE
              value: /var/run/secrets/anvilkit/queue/{{ .Values.queue.secret.key }}
            {{- end }}
            {{- with .Values.queue.tls.caFile }}
            - name: ANVILKIT_BACKGROUND_WORKER_QUEUE_TLS_CA_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.owners.knowledge.address }}
            - name: ANVILKIT_BACKGROUND_WORKER_KNOWLEDGE_ADDRESS
              value: {{ .Values.owners.knowledge.address | quote }}
            {{- end }}
            {{- if .Values.owners.mcp.address }}
            - name: ANVILKIT_BACKGROUND_WORKER_MCP_ADDRESS
              value: {{ .Values.owners.mcp.address | quote }}
            {{- end }}
            {{- if .Values.bullBoard.enabled }}
            - name: ANVILKIT_BACKGROUND_WORKER_BULL_BOARD_LISTEN
              value: {{ printf "%s:%d" .Values.listen.address (int .Values.bullBoard.port) | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
            {{- if .Values.bullBoard.enabled }}
            - name: bull-board
              containerPort: {{ .Values.bullBoard.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/anvilkit/anvilkit-agent-background-worker
              readOnly: true
            {{- if .Values.trust.configMap }}
            - name: trust
              mountPath: /etc/anvilkit/trust
              readOnly: true
            {{- end }}
            - name: queue
              mountPath: {{ if eq .Values.secrets.provider "csi" }}/var/run/secrets/anvilkit/csi{{ else }}/var/run/secrets/anvilkit/queue{{ end }}
              readOnly: true
            {{- if eq .Values.identity.mode "mtls" }}
            - name: identity
              mountPath: /etc/anvilkit/identity
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "anvilkit-agent-background-worker.fullname" . }}
        {{- if .Values.trust.configMap }}
        - name: trust
          configMap:
            name: {{ .Values.trust.configMap }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- if eq .Values.secrets.provider "csi" }}
        - name: queue
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "anvilkit-agent-background-worker.fullname" . }}
        {{- else }}
        - name: queue
          secret:
            secretName: {{ .Values.queue.secret.name }}
        {{- end }}
        {{- if eq .Values.identity.mode "mtls" }}
        - name: identity
          secret:
            secretName: {{ include "anvilkit-agent-background-worker.identitySecret" . }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
