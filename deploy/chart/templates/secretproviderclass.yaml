{{- include "anvilkit-agent-background-worker.require" . -}}
{{- if eq .Values.secrets.provider "csi" }}
{{- $c := .Values.secrets.csi }}
# P0.6: the worker's queue URL (its own Valkey ACL user) from OpenBao (no
# Kubernetes Secret), world-readable inside the Pod's own volume (the
# container runs as a non-root user).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "anvilkit-agent-background-worker.fullname" . }}
  labels:
    {{- include "anvilkit-agent-background-worker.labels" . | nindent 4 }}
spec:
  provider: openbao
  parameters:
    baoAddress: {{ $c.address | quote }}
    {{- with $c.caCertPath }}
    baoCACertPath: {{ . | quote }}
    {{- end }}
    roleName: {{ default (include "anvilkit-agent-background-worker.serviceAccountName" .) $c.role | quote }}
    audience: {{ $c.audience | quote }}
    objects: |
      - objectName: "queue-url"
        secretPath: {{ $c.path | quote }}
        secretKey: "queue-url"
        filePermission: 0444
{{- end }}
