apiVersion: v1
kind: Service
metadata:
  name: {{ include "anvilkit-agent-background-worker.fullname" . }}
  labels:
    {{- include "anvilkit-agent-background-worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "anvilkit-agent-background-worker.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.health.port }}
      targetPort: health
      protocol: TCP
    {{- if .Values.bullBoard.enabled }}
    - name: bull-board
      port: {{ .Values.bullBoard.port }}
      targetPort: bull-board
      protocol: TCP
    {{- end }}
